[base]
package = ocean
env_name = puffer_maglev
policy_name = Policy
rnn_name = Recurrent

[env]
num_envs = 8

[vec]
num_envs = 8
num_workers = 8

[train]
total_timesteps = 10_000_000
gamma = 0.95
learning_rate = 0.0003
minibatch_size = 1024

[sweep]
metric = score
goal = maximize

[sweep.train.total_timesteps]
distribution = log_normal
min = 1e6
max = 1e7
mean = 5e6
scale = 0.5

[sweep.train.gamma]
distribution = log_normal
min = 0.9
max = 0.999
mean = 0.97

[sweep.train.gae_lambda]
distribution = log_normal
min = 0.7
max = 0.999
mean = 0.95

[sweep.train.learning_rate]
distribution = log_normal
min = 0.0001
max = 0.001
mean = 0.0003
scale = 0.5